; Makerfabs ESP32 UWB DW3000 - distance meter (SS-TWR)
;   pio run -e initiator -t upload   --upload-port COMx   (firmware)
;   pio run -e initiator -t uploadfs --upload-port COMx   (web app from data/)
;   same with -e responder for the other board
; Both boards must run firmware built from the same include/uwb_config.h.

[platformio]
default_envs = initiator, responder

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = vendor/Makerfabs-ESP32-UWB-DW3000
board_build.filesystem = littlefs

[env:initiator]
build_src_filter = +<initiator.cpp>

[env:responder]
build_src_filter = +<responder.cpp>
